# Runtime copy shared by enabled CommunityNoticeBot features.
game.help: |
  ## {game_name} guide

  Produce secret organisms to collect **secret shards**, synthesize secrets to grow stronger, then concentrate your progress into story essence.
  Production resets daily at 05:00 KST.

  **Commands**
  `/게임 현황` — View shards, story essence, organisms, and secrets.
  `/게임 생산` — Run today's organism production (once per day).
  `/게임 합성 <비밀> <수량>` — Synthesize a selected secret with shards.
  `/게임 최대합성` — Synthesize as much as possible in the configured priority order.
  `/게임 가격` — View synthesis prices and the concentration estimate.
  `/게임 농축` — Reset run resources for story essence; available once per week.
  `/게임 도움말` — Show this guide again.
  `/게임 보상` — View community rewards configured for this server.

  A new account can concentrate without community rewards after six `produce → maximum synthesis` cycles and one further production. Community rewards are optional accelerators; use `/게임 보상` to inspect this server's settings.
