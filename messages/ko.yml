# 활성 CommunityNoticeBot 기능에서 공통으로 쓰는 실행 중 문구입니다.
game.help: |
  ## {game_name} 도움말

  비밀 유기체를 생산해 **비밀 파편**을 모으고, 비밀을 합성하여 더 강해지는 증분 게임입니다.
  생산은 매일 오전 5시(한국 시간)에 초기화됩니다.

  **명령어**
  `/게임 현황` — 비밀 파편, 이야기의 정수, 유기체, 비밀 보유량을 확인합니다.
  `/게임 생산` — 유기체로 오늘의 생산을 실행합니다. 하루에 한 번만 가능합니다.
  `/게임 합성 <비밀> <수량>` — 비밀 파편으로 원하는 비밀을 합성합니다.
  `/게임 최대합성` — 우선순위에 따라 가능한 만큼 자동 합성합니다.
  `/게임 가격` — 모든 비밀의 다음 합성 가격과 농축 예상치를 확인합니다.
  `/게임 농축` — 자원을 초기화하고 이야기의 정수를 얻습니다. 플레이어마다 주 1회 가능합니다.
  `/게임 도움말` — 이 안내를 다시 표시합니다.
  `/게임 보상` — 이 서버에서 설정한 공지·릴레이 보상을 확인합니다.

  새 계정은 커뮤니티 보상 없이도 `생산 → 최대합성`을 6번 반복한 뒤 한 번 더 생산해 농축할 수 있습니다. 커뮤니티 보상은 선택 사항인 가속이며, 현재 설정은 `/게임 보상`에서 확인할 수 있습니다.
