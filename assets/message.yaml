relay_story:
  too_long: |
    안녕하세요! 이야기잇기 채널에 작성하신 메시지가 200자를 초과하여 삭제되었습니다.
    한 번에 200자 이내로 작성해 주세요.

    📝 작성하셨던 내용:
    {content}

  consecutive: |
    안녕하세요! 이야기잇기 채널에서 연속으로 두 번 메시지를 작성하셔서 삭제되었습니다.
    다른 분이 글을 작성한 뒤에 다시 참여해 주세요.

    📝 작성하셨던 내용:
    {content}

kyohoon:
  not_latest_thread: |
    안녕하세요! 현재 교훈 신청 기간이 아닌 스레드에 작성하셔서 메시지가 삭제되었습니다.
    가장 최근 스레드에서 교훈을 신청해 주세요.

    📝 작성하셨던 내용:
    {content}

  duplicate_submission: |
    안녕하세요! 이번 주차에 이미 교훈을 신청하셨습니다. 중복 신청은 허용되지 않아 메시지가 삭제되었습니다.

    📝 작성하셨던 내용:
    {content}

  edit_after_posted: |
    안녕하세요! 신청하신 교훈이 이미 게시되었기 때문에 수정 또는 삭제 내용이 반영되지 않습니다.
