help:
  secretae_incremental: |
    ## 시크리타이 인크리멘탈 도움말

    비밀 유기체를 생산해 **비밀 파편**을 모으고, 비밀을 합성하여 더 강해지는 증분 게임입니다.
    생산은 매일 오전 5시(한국 시간)에 초기화됩니다.

    **명령어**
    `/게임 현황` — 비밀 파편, 이야기의 정수, 유기체, 비밀 보유량을 확인합니다.
    `/게임 생산` — 유기체로 오늘의 생산을 실행합니다. 하루에 한 번만 가능합니다.
    `/게임 합성 <비밀> <수량>` — 비밀 파편으로 원하는 비밀을 합성합니다. 비밀은 유기체의 생산량을 증폭시킵니다.
    `/게임 최대합성` — ◯, □, ♡, 검정부터 빨강 순서로 가능한 만큼 자동 합성합니다.
    `/게임 가격` — 모든 비밀의 다음 합성 가격과 농축 예상치를 확인합니다.
    `/게임 농축` — 자원을 초기화하고 이야기의 정수를 얻습니다. 플레이어마다 주 1회 가능하며 월요일 오전 5시(KST)에 초기화됩니다.
    `/게임 도움말` — 이 안내를 다시 표시합니다.

    **핵심 비밀**
    ◯는 생산량을, □는 합성 효율을, ♡는 농축 정수 획득량을 높입니다.
    교훈이 게시되면 이야기의 정수를 보상으로 받고, 토막상식이 게시되면 모든 비밀이 1.05배가 됩니다.

  secretae: |
    ## 시크리타이 게임 안내

    이모지로 가득 찬 공장을 운영하여 **Secret**을 모으는 수집 게임이에요.

    **📦 Secret이란?**
    게임 내 재화예요. 빨강·주황·노랑 같은 **색깔 Secret** 8종과, 동그라미·네모·하트 같은 **모양 Secret** 3종으로 나뉘어요.

    **🏭 공장이란?**
    이모지들이 격자 모양으로 배열된 나만의 공간이에요. 게임에 등록하면 공장 3개가 지급돼요.
    하루에 한 번, 세 공장이 모두 한 번씩 가동되어 그날의 Secret을 생산할 수 있어요.

    **✨ 얼마나 생산되나요?**
    같은 색깔 또는 같은 모양의 이모지가 상하좌우로 많이 이어져 있을수록 생산량이 늘어나요.
    이어진 개수의 제곱만큼 생산되기 때문에, 크게 연결될수록 훨씬 유리해요.
    ```
    2개 연결 →  4
    3개 연결 →  9
    4개 연결 → 16
    ```

    **📋 명령어 목록**
    `/게임 등록` — 게임을 시작해요. 처음 한 번만 하면 돼요.
    `/게임 프로필` — 내가 보유한 Secret과 공장 현황을 확인해요.
    `/게임 생산` — 세 공장을 모두 가동해 오늘의 Secret을 생산해요. 하루 1회 제한이에요.
    `/게임 공장 [번호]` — 해당 번호 공장의 이모지 배열을 자세히 봐요.
    `/게임 아이템` — 보유 아이템을 사용, 강화, 변환, 분해해요.

    **🎒 아이템**
    아이템은 3칸까지 보유할 수 있어요. 아이템 사용은 하루 1회 제한이고, 강화·변환·분해로 아이템을 바꿀 수 있어요.

    **📖 이야기의 정수**
    이야기잇기 채널에 규칙에 맞는 글을 남기면 이야기의 정수를 얻어요.
    신청한 토막상식이 게시되어도 이야기의 정수를 얻을 수 있어요.
    이미 오늘의 생산 또는 아이템 사용 횟수를 다 썼을 때, 이야기의 정수 1개로 한 번 더 진행할 수 있어요.

    **🏅 교훈 신청 보상**
    교훈 신청 게시판에 유효한 교훈을 신청하면 보유한 모든 공장이 각각 10회씩 추가 생산돼요.

    생산과 아이템 사용 횟수는 매일 **오전 6시(한국 시간)** 에 초기화돼요.

